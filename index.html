function soir(){const n=S.set.n||2,L=S.recipes.filter(ok).map(r=>[cov(r)+score(r)*.1,r]).sort((a,b)=>b[0]-a[0]).slice(0,6),rr=S.stock.filter(s=>s.rest);
mod(`<h2>🍳 Que cuisiner ce soir ?</h2>${rr.length?`<div class=card>🥡 Restes à finir : ${rr.map(s=>E(s.name.replace('Restes · ',''))+' ('+s.q+')').join(', ')}</div>`:''}${L.map(([,r])=>{const m=scale(r,n).filter(i=>have(i.name,kind(i.u))<base(i.q,i.u)-.001).map(i=>i.name);return `<div class=card onclick="rv('${r.id}',${n})"><b>${E(r.t)}</b> <span class=tag>${Math.round(cov(r)*100)}% en stock</span>${score(r)?' <span class=tag>anti-gaspi</span>':''}<div class=mu>${m.length?'Manque : '+E(m.slice(0,4).join(', '))+(m.length>4?'…':''):'Tout est en stock ✅'}</div></div>`}).join('')||'<p class=mu>Ajoutez d’abord des recettes.</p>'}`)}
const dec=()=>{const t=new Date();t.setDate(t.getDate()+1);const ds=[iso(new Date()),iso(t)],o=[];S.plan.filter(p=>ds.includes(p.date)&&!p.done&&p.rid&&R(p.rid)).forEach(p=>R(p.rid).ing.forEach(i=>{const s=S.stock.find(x=>x.loc=='Congélateur'&&nn(x.name)==nn(i.name));if(s&&!o.some(z=>z[0]==s.name))o.push([s.name,p.date==ds[0]?'aujourd’hui':'demain'])}));return o};
function rst(id){const p=S.plan.find(x=>x.id==id),r=R(p.rid);mod(`<h2>🥡 Restes : ${E(r.t)}</h2><label>Portions restantes</label><input id=rq type=number min=1 value=1><button class=b onclick="rst2('${id}')">Enregistrer</button>`)}

function dj(dt){const rk=p=>p.slot=='apero'?2:p.slot=='dessert'?1:0,es=S.plan.filter(x=>x.date==dt).sort((a,b)=>rk(a)-rk(b)),hr=es.some(p=>rk(p)==0);

// ---- logique métier
const bad=r=>(S.set.ex||[]).find(e=>r.ing.some(i=>nn(i.name).includes(nn(e))));
const ok=r=>!bad(r);
const have=(n,k)=>S.stock.filter(s=>nn(s.name)==nn(n)&&kind(s.u)==k).reduce((a,s)=>a+base(s.q,s.u),0);
const scale=(r,n)=>r.ing.map(i=>({...i,q:i.q*n/r.base}));
const ed=s=>{let d=s.d||'';if(s.o){const x=new Date(s.o+'T12:00');x.setDate(x.getDate()+(s.ov||S.set.od||3));const y=iso(x);d=d&&d<y?d:y}return d};
const soon=()=>S.stock.filter(s=>ed(s)&&dl(ed(s))<=(S.set.al??3));
const score=r=>{const e=soon();return r.ing.filter(i=>e.some(s=>nn(s.name)==nn(i.name))).length};
const wk=()=>{const d=new Date();d.setHours(12);d.setDate(d.getDate()-((d.getDay()+6)%7)+7*S.wo);return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})};
function needs(ps){const m={};ps.forEach(p=>{const r=R(p.rid);if(!r)return;scale(r,p.n||2).forEach(i=>{const k=nn(i.name)+'|'+kind(i.u);m[k]=m[k]||{name:i.name,k:kind(i.u),q:0};m[k].q+=base(i.q,i.u)})});return Object.values(m)}
function gen(){const rs=S.recipes.filter(ok);if(!rs.length)return toast('Ajoute d’abord des recettes');const used=new Set();wk().map(iso).forEach(dt=>['plat'].forEach(k=>{if(S.plan.some(p=>p.date==dt&&!['apero','dessert'].includes(p.slot)))return;const c=rs.filter(r=>!used.has(r.id)||used.size>=rs.length).sort((a,b)=>score(b)-score(a)+Math.random()-.5)[0];if(c){used.add(c.id);save('plan',{date:dt,slot:k,rid:c.id,n:S.set.n||2})}}));toast('Semaine générée ✨')}
function genShop(){const ws=wk().map(iso),ps=S.plan.filter(p=>ws.includes(p.date)&&!p.done);S.shop.filter(x=>x.auto&&!x.c).forEach(x=>del('shop',x.id));
const out=needs(ps).map(n=>({name:n.name,k:n.k,q:n.q-have(n.name,n.k)})).filter(n=>n.q>.001);
S.stock.filter(s=>s.min&&s.q<s.min&&!out.some(o=>nn(o.name)==nn(s.name))).forEach(s=>out.push({name:s.name,k:kind(s.u),q:base(s.min-s.q,s.u)}));
out.forEach(n=>{const[a,u]=pr(Math.ceil(n.q),n.k),st=S.stock.find(s=>nn(s.name)==nn(n.name));save('shop',{name:n.name,q:a,u,p:st?.p||0,auto:1,c:0})});S.tab='shop';render();toast(out.length+' article(s) à acheter')}
function cook(id){const p=S.plan.find(x=>x.id==id),r=R(p.rid);if(p.done)return;let sv=0;
if(r)scale(r,p.n||2).forEach(i=>{let need=base(i.q,i.u);const k=kind(i.u);S.stock.filter(s=>nn(s.name)==nn(i.name)&&kind(s.u)==k).sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:1).forEach(s=>{if(need<=0)return;const t=Math.min(need,base(s.q,s.u));need-=t;if(ed(s)&&dl(ed(s))<=(S.set.al??3))sv++;const left=(base(s.q,s.u)-t)/U[s.u][1];left>.001?save('stock',{...s,q:left}):del('stock',s.id)})});
const st=p.si&&S.stock.find(x=>x.id==p.si);if(st&&p.sq){const l=st.q-p.sq;l>.001?save('stock',{...st,q:l,o:st.o||iso(new Date())}):del('stock',st.id)}
if(sv)sset('saved',(S.set.saved||0)+sv);save('plan',{...p,done:true});toast('Bon appétit ! Stock mis à jour');dj(p.date)}
function pi(l){l=l.trim();const m=l.match(/^([\d.,\/]+)\s*(kg|g|ml|cl|l|cs|cc|u)\b\.?\s*(?:de |d['’])?(.*)$/i)||l.match(/^([\d.,\/]+)?\s*()(?:de |d['’])?(.*)$/),n=m[1],q=!n?1:n.includes('/')?n.split('/')[0]/n.split('/')[1]:parseFloat(n.replace(',','.'));return{name:m[3].trim(),q:q||1,u:(m[2]||'u').toLowerCase()}}
