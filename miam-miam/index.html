<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miam-miam</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#8a2f56">
<style>
:root{--bg:#fbf0ee;--cd:#fffaf8;--tx:#3a1f2b;--mu:#8a6b76;--pr:#8a2f56;--on:#fff;--pr2:#f2a516;--ok:#4f8a3a;--wa:#e8890c;--ko:#c93a3a;--bd:#efd9d6;--sh:0 4px 16px #8a2f5614}
[data-t=dark]{--bg:#1c1418;--cd:#291d24;--tx:#f8ebe6;--mu:#b09aa3;--pr:#f5b53c;--on:#2a1a10;--bd:#3b2b34;--sh:0 4px 16px #0006}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:.3em 0}h1{font-size:28px}
#app{padding:16px 14px 96px;max-width:980px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mu);cursor:pointer}nav a b{display:block;font-size:21px}nav a.on{color:var(--pr);font-weight:700}
.lg{display:none}
@media(min-width:800px){nav{top:0;right:auto;width:160px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:16px;justify-content:flex-start}nav a{flex:none;padding:14px;font-size:14px}nav a b{display:inline;margin-right:8px}.lg{display:block;text-align:center;color:var(--pr);font-size:22px;margin-bottom:12px}#app{margin-left:180px;padding-bottom:30px}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh);margin:10px 0}
.b{background:var(--pr);color:var(--on);border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}.b.r{background:var(--ko);color:#fff}.b:disabled{opacity:.4}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
input[type=checkbox]{width:24px;height:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.rc{border-radius:16px;overflow:hidden;background:var(--cd);border:1px solid var(--bd);cursor:pointer;box-shadow:var(--sh)}.rc img,.rc i{display:block;width:100%;height:120px;object-fit:cover;background:linear-gradient(135deg,var(--pr),var(--pr2))}.rc div{padding:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}#mod.on{display:flex}#mod>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media(min-width:800px){#mod{align-items:center}#mod>div{border-radius:20px}}
.sl{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px dashed var(--bd);cursor:pointer}.sl small{width:60px;color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pr2);color:#3a1f2b;display:inline-block}.tag.ko{background:var(--ko);color:#fff}
.mu{color:var(--mu)}.done{text-decoration:line-through;opacity:.6}
#t{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:20}
#sy{position:fixed;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--mu);z-index:20}#tm{position:fixed;top:26px;right:10px;background:var(--pr);color:var(--on);padding:8px 14px;border-radius:99px;font-weight:700;display:none;z-index:20}#pr{display:none}
@media print{body>*{display:none!important}body>#pr{display:block!important;color:#000;background:#fff;padding:20px;font-family:Georgia,serif}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="mod"></div><div id="t"></div><div id="tm"></div><div id="sy"></div><div id="pr"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={recipes:[],stock:[],plan:[],shop:[],set:{},tab:'menu',wo:0};let fid=1,ph='',sc,stm;
const U={g:['m',1],kg:['m',1e3],ml:['v',1],cl:['v',10],l:['v',1e3],cs:['v',15],cc:['v',5],u:['u',1]},UL={u:'unité',cs:'c. à soupe',cc:'c. à café'};
const SL=[['midi','Midi'],['soir','Soir'],['apero','Apéro'],['dessert','Dessert / pâtisserie']];
const nn=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[sx]$/,'');
const base=(q,u)=>q*U[u][1],kind=u=>U[u][0];
const pr=(q,k)=>k=='m'?(q>=1e3?[q/1e3,'kg']:[q,'g']):k=='v'?(q>=1e3?[q/1e3,'l']:[q,'ml']):[q,'u'];
const fmt=(q,u)=>(Math.round(q*10)/10).toString().replace('.',',')+(u=='u'?'':' '+u);
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dl=d=>d?Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5)-1:99;
const cor=d=>{const k=dl(d);return k<0?'var(--ko)':k<=(S.set.al??3)?'var(--wa)':'var(--ok)'};
const R=id=>S.recipes.find(r=>r.id==id);
const save=(c,o)=>{o=JSON.parse(JSON.stringify(o));o.id=o.id||uid();o.u=Date.now();mg(c,o);snd({t:'ch',c,o});persist();render()};
const del=(c,id)=>save(c,{id,x:1}),up=(c,id,k,v)=>save(c,{...S[c].find(y=>y.id==id),[k]:v});
const sset=(k,v)=>{D.set={...D.set,[k]:v,u:Date.now()};view();snd({t:'ch',c:'set',o:D.set});persist();render()};
const toast=t=>{const e=$('#t');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
const mod=h=>{$('#mod').innerHTML='<div>'+h+'</div>';$('#mod').classList.add('on')};
const stopScan=()=>{clearInterval(sc);stm&&stm.getTracks().forEach(t=>t.stop());stm=0};
const cl=()=>{stopScan();$('#mod').classList.remove('on')};$('#mod').onclick=e=>e.target.id=='mod'&&cl();
const ap=()=>{const t=localStorage.th||'auto';document.documentElement.dataset.t=t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t};ap();matchMedia('(prefers-color-scheme:dark)').onchange=ap;
// ---- stockage local + synchro directe entre appareils (sans compte)
const uid=()=>crypto.randomUUID().replace(/-/g,'').slice(0,16);
let D={recipes:[],stock:[],plan:[],shop:[],set:{}},wt,pe,cn,my=localStorage.my||(localStorage.my='mm'+uid()),pp=localStorage.pp||'';
const idb=(m,k,v)=>new Promise(r=>{const q=indexedDB.open('mm',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>r();q.onsuccess=()=>{const t=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),a=m=='get'?t.get(k):t.put(v,k);a.onsuccess=()=>r(a.result);a.onerror=()=>r()}});
const persist=()=>{clearTimeout(wt);wt=setTimeout(()=>idb('put','d',D),300)};
const view=()=>{['recipes','stock','plan','shop'].forEach(c=>S[c]=D[c].filter(o=>!o.x));S.set=D.set};
function mg(c,o){if(c=='set'){if((o.u||0)>(D.set.u||0)){D.set=o;view();return 1}return 0}o.u=o.u||1;const i=D[c].findIndex(x=>x.id==o.id);if(i<0)D[c].push(o);else if((D[c][i].u||0)<o.u)D[c][i]=o;else return 0;view();return 1}
const mall=d=>{let ch=0;['recipes','stock','plan','shop'].forEach(k=>(d[k]||[]).forEach(o=>ch|=mg(k,o)));ch|=mg('set',d.set||{});if(ch){persist();render()}};
const snd=m=>cn&&cn.open&&cn.send(m);
const dot=()=>{const e=$('#sy');e&&(e.style.background=cn&&cn.open?'var(--ok)':'var(--mu)')};
function link(c){cn=c;c.on('open',()=>{pp=localStorage.pp=c.peer;c.send({t:'all',d:D});render()});c.on('data',m=>m.t=='all'?mall(m.d):mg(m.c,m.o)&&(persist(),render()));c.on('close',()=>render());c.on('error',()=>{})}
function conn(){if(pp&&pe&&pe.open&&!(cn&&cn.open))link(pe.connect(pp,{reliable:true}))}
function net(){pe=new Peer(my);pe.on('open',conn);pe.on('connection',c=>{cn&&cn.open&&cn.close();link(c)});pe.on('disconnected',()=>pe.reconnect());pe.on('error',()=>{})}
function pair(){const v=$('#pc').value.trim();if(!v||v==my)return toast('Code invalide');pp=localStorage.pp=v;conn();toast('Association en cours…')}
// ---- rayons, minuteurs, alertes
const RAYS=['Fruits & légumes','Boucherie & poisson','Frais','Épicerie','Surgelés','Boissons','Autre'],
RX=[[4,/surgel|glace/],[1,/poulet|boeuf|porc|veau|agneau|jambon|lardon|saumon|poisson|thon|steak|viande|dinde|saucisse|crevette|cabillaud|canard/],[0,/carotte|pomme|poire|banane|citron|salade|laitue|courgette|poireau|champignon|\bail\b|oignon|echalote|tomate|patate|legume|fruit|persil|basilic|coriandre|aubergine|poivron|concombre|orange|avocat|chou|epinard|fraise|haricot vert|radis|betterave|menthe/],[2,/\blait(?!u)|beurre|creme|fromage|yaourt|oeuf|œuf|gruyere|mozzarella|parmesan|emmental|skyr|tofu|pate fraiche|pate feuilletee/],[5,/\beau\b|jus|vin|biere|cafe|\bthe\b|soda|sirop|cidre/],[3,/pate|riz|farine|sucre|huile|\bsel\b|poivre|conserve|sauce|cereale|chocolat|biscuit|pain|semoule|lentille|pois chiche|vinaigre|moutarde|epice|miel|confiture|noix|amande|levure|bouillon/]];
const ray=n=>{n=nn(n);const m=RX.find(x=>x[1].test(n));return m?RAYS[m[0]]:'Autre'};
let tmI,tmE;
function timer(m){clearInterval(tmI);tmE=Date.now()+m*6e4;tmI=setInterval(()=>{const s=Math.round((tmE-Date.now())/1e3),e=$('#tm');if(s<=0){clearInterval(tmI);e.style.display='none';navigator.vibrate&&navigator.vibrate([400,200,400]);try{const a=new AudioContext,o=a.createOscillator();o.connect(a.destination);o.start();setTimeout(()=>o.stop(),900)}catch(x){}return toast('⏱ Minuteur terminé !')}e.style.display='block';e.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);toast('Minuteur lancé')}
const tb=s=>{const m=s.match(/(\d+)\s*(h(?:eures?)?|min(?:utes?)?)\b/i);return m?` <button class="b g" onclick="timer(${m[2][0].toLowerCase()=='h'?m[1]*60:m[1]})">⏱ ${m[0]}</button>`:''};
function nt(){const e=soon();if(!e.length||!('Notification'in window)||Notification.permission!='granted'||localStorage.nd==iso(new Date()))return;localStorage.nd=iso(new Date());navigator.serviceWorker.ready.then(r=>r.showNotification('Miam-miam 🍲',{body:e.slice(0,5).map(s=>s.name+(dl(s.d)<0?' (périmé)':dl(s.d)?' (dans '+dl(s.d)+' j)':' (aujourd’hui)')).join(', ')+' à consommer',icon:'icon-192.png'}))}
const nreq=()=>'Notification'in window?Notification.requestPermission().then(p=>{toast(p=='granted'?'Alertes activées':'Alertes refusées');nt()}):toast('Alertes non prises en charge ici');
function imb(i){const f=i.files[0];if(!f)return;f.text().then(t=>{mall(JSON.parse(t));toast('Sauvegarde fusionnée')}).catch(()=>toast('Fichier invalide'))}
// ---- logique métier
const bad=r=>(S.set.ex||[]).find(e=>r.ing.some(i=>nn(i.name).includes(nn(e))));
const ok=r=>!bad(r);
const have=(n,k)=>S.stock.filter(s=>nn(s.name)==nn(n)&&kind(s.u)==k).reduce((a,s)=>a+base(s.q,s.u),0);
const scale=(r,n)=>r.ing.map(i=>({...i,q:i.q*n/r.base}));
const soon=()=>S.stock.filter(s=>s.d&&dl(s.d)<=(S.set.al??3));
const score=r=>{const e=soon();return r.ing.filter(i=>e.some(s=>nn(s.name)==nn(i.name))).length};
const wk=()=>{const d=new Date();d.setHours(12);d.setDate(d.getDate()-((d.getDay()+6)%7)+7*S.wo);return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})};
function needs(ps){const m={};ps.forEach(p=>{const r=R(p.rid);if(!r)return;scale(r,p.n||2).forEach(i=>{const k=nn(i.name)+'|'+kind(i.u);m[k]=m[k]||{name:i.name,k:kind(i.u),q:0};m[k].q+=base(i.q,i.u)})});return Object.values(m)}
function gen(){const rs=S.recipes.filter(ok);if(!rs.length)return toast('Ajoute d’abord des recettes');const used=new Set();wk().map(iso).forEach(dt=>['midi','soir'].forEach(k=>{if(S.plan.some(p=>p.date==dt&&p.slot==k))return;const c=rs.filter(r=>!used.has(r.id)||used.size>=rs.length).sort((a,b)=>score(b)-score(a)+Math.random()-.5)[0];if(c){used.add(c.id);save('plan',{date:dt,slot:k,rid:c.id,n:S.set.n||2})}}));toast('Semaine générée ✨')}
function genShop(){const ws=wk().map(iso),ps=S.plan.filter(p=>ws.includes(p.date)&&!p.done);S.shop.filter(x=>x.auto&&!x.c).forEach(x=>del('shop',x.id));
const out=needs(ps).map(n=>({name:n.name,k:n.k,q:n.q-have(n.name,n.k)})).filter(n=>n.q>.001);
S.stock.filter(s=>s.min&&s.q<s.min&&!out.some(o=>nn(o.name)==nn(s.name))).forEach(s=>out.push({name:s.name,k:kind(s.u),q:base(s.min-s.q,s.u)}));
out.forEach(n=>{const[a,u]=pr(Math.ceil(n.q),n.k),st=S.stock.find(s=>nn(s.name)==nn(n.name));save('shop',{name:n.name,q:a,u,p:st?.p||0,auto:1,c:0})});S.tab='shop';render();toast(out.length+' article(s) à acheter')}
function cook(id){const p=S.plan.find(x=>x.id==id),r=R(p.rid);let sv=0;if(r&&!p.done)scale(r,p.n||2).forEach(i=>{let need=base(i.q,i.u);const k=kind(i.u);S.stock.filter(s=>nn(s.name)==nn(i.name)&&kind(s.u)==k).sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:1).forEach(s=>{if(need<=0)return;const t=Math.min(need,base(s.q,s.u));need-=t;if(s.d&&dl(s.d)<=(S.set.al??3))sv++;const left=(base(s.q,s.u)-t)/U[s.u][1];left>.001?save('stock',{...s,q:left}):del('stock',s.id)})});if(sv)sset('saved',(S.set.saved||0)+sv);save('plan',{...p,done:true});cl();toast('Bon appétit ! Stock mis à jour')}
function pi(l){l=l.trim();const m=l.match(/^([\d.,\/]+)\s*(kg|g|ml|cl|l|cs|cc|u)\b\.?\s*(?:de |d['’])?(.*)$/i)||l.match(/^([\d.,\/]+)?\s*()(?:de |d['’])?(.*)$/),n=m[1],q=!n?1:n.includes('/')?n.split('/')[0]/n.split('/')[1]:parseFloat(n.replace(',','.'));return{name:m[3].trim(),q:q||1,u:(m[2]||'u').toLowerCase()}}
// ---- vues
function vMenu(){const w=wk(),al=soon(),f=d=>d.toLocaleDateString('fr',{day:'numeric',month:'short'});
return `<h1>Menu de la semaine</h1><div class=row><button class="b g" onclick="S.wo--;render()">‹</button><b class=sp style="text-align:center">${f(w[0])} – ${f(w[6])}</b><button class="b g" onclick="S.wo++;render()">›</button></div>
<div class=row><button class=b onclick=gen()>✨ Générer ma semaine</button><button class="b g" onclick=genShop()>🛒 Liste de courses</button></div>
${al.length?`<div class=card>⚠️ À consommer vite : ${al.map(s=>`<span class=tag style="background:${cor(s.d)};color:#fff">${E(s.name)}</span>`).join(' ')}</div>`:''}
<details class=card><summary>📦 En stock (${S.stock.length})</summary><p class=mu>${S.stock.map(s=>E(s.name)+' '+fmt(s.q,s.u)).join(' · ')||'Rien pour l’instant'}</p></details>
${w.map(d=>{const dt=iso(d);return `<div class=card><h3>${d.toLocaleDateString('fr',{weekday:'long',day:'numeric',month:'short'})}</h3>${SL.map(([k,l])=>{const p=S.plan.find(x=>x.date==dt&&x.slot==k),r=p&&R(p.rid);return `<div class=sl onclick="${p?`pm('${p.id}')`:`pa('${dt}','${k}')`}"><small>${l.split(' ')[0]}</small>${p?`<span class="sp ${p.done?'done':''}">${E(r?r.t:p.txt)} <span class=mu>· ${p.n||2} pers.</span></span>${p.done?'✅':''}`:'<span class="sp mu">+ ajouter</span>'}</div>`}).join('')}</div>`}).join('')}`}
function pa(dt,k){mod(`<h2>Ajouter · ${SL.find(s=>s[0]==k)[1]}</h2><select id=ps><option value="">Texte libre (resto, restes, apéro…)</option>${S.recipes.map(r=>`<option value=${r.id}>${E(r.t)}${bad(r)?' ⚠️':''}</option>`).join('')}</select><input id=pt placeholder="Texte libre"><label>Personnes (invité = +1)</label><input id=pn type=number min=1 value=${S.set.n||2}><div class=row><button class=b onclick="ps2('${dt}','${k}')">Ajouter</button><button class="b g" onclick=cl()>Annuler</button></div>`)}
function ps2(dt,k){const rid=$('#ps').value,txt=$('#pt').value;if(!rid&&!txt)return;save('plan',{date:dt,slot:k,rid,txt,n:+$('#pn').value||2});cl()}
function pm(id){const p=S.plan.find(x=>x.id==id),r=R(p.rid);mod(`<h2>${E(r?r.t:p.txt)}</h2><p class=mu>${p.n||2} personnes ${p.done?'· ✅ fait':''}</p><div class=row>${!p.done?`<button class=b onclick="cook('${id}')">${r?'✅ Cuisiné (retire du stock)':'✅ Fait'}</button>`:''}${r?`<button class="b g" onclick="rv('${r.id}',${p.n||2})">Voir la recette</button>`:''}<button class="b r" onclick="del('plan','${id}');cl()">Supprimer</button></div>`)}
function vRec(){const q=nn(S.q||''),L=S.recipes.filter(r=>!q||nn(r.t).includes(q)||(r.tags||[]).some(t=>nn(t).includes(q)));
return `<h1>Recettes</h1><div class=row><input class=sp placeholder="🔍 Rechercher" value="${E(S.q||'')}" oninput="S.q=this.value;render(1)"><button class=b onclick="rf()">+ Nouvelle</button><button class="b g" onclick=ri()>🔗 Importer</button></div>
<div class=grid>${L.map(r=>`<div class=rc onclick="rv('${r.id}')">${r.ph?`<img src="${E(r.ph)}">`:'<i></i>'}<div><b>${r.fav?'⭐ ':''}${E(r.t)}</b><div class=mu>${r.tp?r.tp+' min · ':''}${r.base} pers.</div>${bad(r)?`<span class="tag ko">contient ${E(bad(r))}</span>`:''}</div></div>`).join('')}</div>${L.length?'':'<p class=mu>Aucune recette pour l’instant. Crée la première avec « + Nouvelle » ou importe-en une depuis un lien.</p>'}`}
function rv(id,n){const r=R(id);n=n||r.base;mod(`${r.ph?`<img src="${E(r.ph)}" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover">`:''}<h2>${r.fav?'⭐ ':''}${E(r.t)}</h2><div class=mu>cuisiné ${S.plan.filter(p=>p.rid==id&&p.done).length}× ${r.tp?'· '+r.tp+' min ':''}${(r.tags||[]).map(t=>`<span class=tag>${E(t)}</span>`).join(' ')}</div>
<div class=row><b>Pour</b><button class="b g" onclick="rv('${id}',${Math.max(1,n-1)})">−</button><b>${n}</b><button class="b g" onclick="rv('${id}',${n+1})">+</button><b>personnes</b></div>
<h3>Ingrédients</h3>${scale(r,n).map(i=>`<div>${have(i.name,kind(i.u))>=base(i.q,i.u)-.001?'✅':'🛒'} ${fmt(i.q,i.u)} ${E(i.name)}</div>`).join('')}
<h3>Préparation</h3><ol>${r.st.map(s=>`<li>${E(s)}${tb(s)}</li>`).join('')}</ol>
<div class=row><button class=b onclick="pa2('${id}',${n})">📅 Au menu</button><button class="b g" onclick="cm('${id}',0)">👩‍🍳 Mode cuisine</button><button class="b g" onclick="pdf('${id}',${n})">📄 PDF</button><button class="b g" onclick="rf('${id}')">✏️</button><button class="b g" onclick="up('recipes','${id}','fav',${!r.fav});cl()">⭐</button></div>`)}
function pa2(id,n){mod(`<h2>Ajouter au menu</h2><input id=pd type=date value="${iso(new Date())}"><select id=pk>${SL.map(([k,l])=>`<option value=${k}>${l}</option>`).join('')}</select><button class=b onclick="pa3('${id}',${n})">Ajouter</button>`)}
function pa3(id,n){const dt=$('#pd').value,k=$('#pk').value,o=S.plan.find(p=>p.date==dt&&p.slot==k);save('plan',{...o,date:dt,slot:k,rid:id,txt:'',n,done:false});cl();toast('Ajouté au menu')}
function cm(id,i){const r=R(id),n=r.st.length;if(!i&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});mod(`<p class=mu>${E(r.t)} · étape ${i+1}/${n}</p><p style="font-size:24px;line-height:1.5">${E(r.st[i]||'')}</p>${tb(r.st[i]||'')}<div class=row><button class="b g" ${i?'':'disabled'} onclick="cm('${id}',${i-1})">‹ Précédent</button><button class=b onclick="${i+1<n?`cm('${id}',${i+1})`:'cl()'}">${i+1<n?'Suivant ›':'Terminé 🎉'}</button></div>`)}
function pdf(id,n){const r=R(id);$('#pr').innerHTML=`<h1>${E(r.t)}</h1>${r.ph?`<img src="${E(r.ph)}" style="max-width:100%;max-height:260px">`:''}<p>${r.tp?r.tp+' min · ':''}Pour ${n} personnes</p><h2>Ingrédients</h2><ul>${scale(r,n).map(i=>`<li>${fmt(i.q,i.u)} ${E(i.name)}</li>`).join('')}</ul><h2>Préparation</h2><ol>${r.st.map(s=>`<li>${E(s)}</li>`).join('')}</ol>`;print()}
function rf(id,d){const r=d||(id&&R(id))||{t:'',base:S.set.n||2,ing:[],st:[],tags:[]};ph=r.ph||'';
mod(`<h2>${id?'Modifier la recette':'Nouvelle recette'}</h2><input id=ft placeholder="Titre" value="${E(r.t)}"><label>Photo (facultatif)</label><input type=file accept="image/*" onchange="pimg(this)"><div class=row><div class=sp>Personnes<input id=fb type=number min=1 value=${r.base}></div><div class=sp>Temps (min)<input id=fp type=number value="${r.tp||''}"></div></div><input id=fg placeholder="Tags : rapide, végétarien…" value="${E((r.tags||[]).join(', '))}"><label>Ingrédients, un par ligne : 200 g farine · 2 œufs · 1 cs huile</label><textarea id=fi rows=7>${E(r.ing.map(i=>i.q+(i.u=='u'?'':' '+i.u)+' '+i.name).join('\n'))}</textarea><label>Étapes, une par ligne</label><textarea id=fs rows=7>${E(r.st.join('\n'))}</textarea><div class=row><button class=b onclick="rs('${id||''}')">Enregistrer</button><button class="b g" onclick=cl()>Annuler</button>${id?`<button class="b r" onclick="del('recipes','${id}');cl()">Supprimer</button>`:''}</div>`)}
function rs(id){const t=$('#ft').value.trim();if(!t)return toast('Donne un titre à la recette');save('recipes',{...(id&&R(id)),id:id||undefined,t,ph,base:+$('#fb').value||2,tp:+$('#fp').value||0,tags:$('#fg').value.split(',').map(s=>s.trim()).filter(Boolean),ing:$('#fi').value.split('\n').filter(l=>l.trim()).map(pi),st:$('#fs').value.split('\n').filter(l=>l.trim())});cl()}
function pimg(i){const f=i.files[0];if(!f)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,700/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ph=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)}
function ri(){mod(`<h2>Importer une recette</h2><p class=mu>Colle le lien d’une recette (Marmiton, 750g…). Internet requis.</p><input id=iu placeholder="https://…"><button class=b onclick=imp()>Importer</button>`)}
async function imp(){try{toast('Import en cours…');const h=await(await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent($('#iu').value.trim()))).text(),d=new DOMParser().parseFromString(h,'text/html');let r;
d.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{try{(function f(o){if(!o||r)return;if(Array.isArray(o))return o.forEach(f);if([].concat(o['@type']||[]).includes('Recipe'))r=o;else f(o['@graph'])})(JSON.parse(s.textContent))}catch(e){}});
if(!r)throw 0;const st=[];(function f(a){[].concat(a||[]).forEach(x=>typeof x=='string'?st.push(x):x.itemListElement?f(x.itemListElement):x.text&&st.push(x.text))})(r.recipeInstructions);
const im=[].concat(r.image||[])[0],mn=s=>{s=String(s||'');return(+(s.match(/(\d+)H/)||[])[1]||0)*60+(+(s.match(/(\d+)M/)||[])[1]||0)};
rf('',{t:r.name||'',ph:typeof im=='string'?im:im?.url||'',base:parseInt([].concat(r.recipeYield||[])[0])||2,tp:mn(r.totalTime)||mn(r.prepTime)+mn(r.cookTime),tags:[],ing:(r.recipeIngredient||[]).map(pi),st:st.map(s=>s.replace(/\s+/g,' ').trim())})}catch(e){toast('Import impossible : saisis la recette à la main')}}
function vStock(){const L=[...S.stock].sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:1),sg=S.recipes.filter(ok).map(r=>[score(r),r]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,3);
return `<h1>Stock</h1><div class=row><button class=b onclick="sf()">+ Ajouter</button><button class="b g" onclick=scan()>📷 Scanner un code-barres</button></div>
${sg.length?`<div class=card><b>🍳 Idées anti-gaspi</b>${sg.map(x=>`<div><a onclick="rv('${x[1].id}')" style="color:var(--pr);cursor:pointer">${E(x[1].t)}</a> <span class=mu>(${x[0]} produit(s) à finir)</span></div>`).join('')}</div>`:''}
${L.map(s=>`<div class="card row" onclick="sf('${s.id}')"><i class=dot style="background:${cor(s.d)}"></i><b class=sp>${E(s.name)}</b><span>${fmt(s.q,s.u)}</span><span class=mu>${s.d?(dl(s.d)<0?'périmé':dl(s.d)==0?'aujourd’hui':'dans '+dl(s.d)+' j'):''}</span><span class=mu>${s.loc||''}</span></div>`).join('')||'<p class=mu>Le stock est vide. Ajoute un produit ou scanne un code-barres.</p>'}`}
function sf(id,d){const s=d||(id&&S.stock.find(x=>x.id==id))||{name:'',q:1,u:'u',loc:'Frigo'};
mod(`<h2>${id?'Modifier':'Ajouter au stock'}</h2><input id=sn placeholder="Produit" value="${E(s.name)}"><div class=row><input id=sq class=sp type=number step=any value=${s.q}><select id=su class=sp>${Object.keys(U).map(u=>`<option value=${u} ${u==s.u?'selected':''}>${UL[u]||u}</option>`).join('')}</select></div><label>Date de péremption</label><input id=sd type=date value="${s.d||''}"><select id=sl>${['Frigo','Congélateur','Placard'].map(l=>`<option ${l==s.loc?'selected':''}>${l}</option>`).join('')}</select><div class=row><input id=sm class=sp type=number step=any placeholder="Seuil min." value="${s.min||''}"><input id=sp class=sp type=number step=any placeholder="Prix €" value="${s.p||''}"></div><div class=row><button class=b onclick="ss('${id||''}','${s.shop||''}')">Enregistrer</button><button class="b g" onclick=cl()>Annuler</button>${id?`<button class="b r" onclick="del('stock','${id}');cl()">Supprimer</button>`:''}</div>`)}
function ss(id,sh){const n=$('#sn').value.trim();if(!n)return toast('Nom du produit ?');save('stock',{...(id&&S.stock.find(x=>x.id==id)),id:id||undefined,name:n,q:+$('#sq').value||0,u:$('#su').value,d:$('#sd').value,loc:$('#sl').value,min:+$('#sm').value||0,p:+$('#sp').value||0});const pz=+$('#sp').value;if(sh){if(pz){const m=iso(new Date()).slice(0,7);sset('sp',{...S.set.sp,[m]:(S.set.sp?.[m]||0)+pz})}del('shop',sh)}cl()}
async function scan(){if(!('BarcodeDetector'in window)){const c=prompt('Scan non disponible sur cet appareil. Saisis le code-barres :');return c&&lk(c.trim())}
mod(`<video id=v playsinline style="width:100%;border-radius:12px"></video><button class="b g" onclick=cl()>Annuler</button>`);try{const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});stm=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#v');v.srcObject=stm;await v.play();sc=setInterval(async()=>{const r=await bd.detect(v).catch(()=>[]);if(r[0]){cl();lk(r[0].rawValue)}},400)}catch(e){cl();toast('Caméra inaccessible')}}
async function lk(c){toast('Recherche du produit…');let n='';try{const j=await(await fetch('https://world.openfoodfacts.org/api/v2/product/'+c+'.json?fields=product_name')).json();n=j.product?.product_name||''}catch(e){}sf('',{name:n,q:1,u:'u',loc:'Frigo'})}
function vShop(){const t=S.shop.reduce((a,x)=>a+(+x.p||0),0),b=S.set.bud;
return `<h1>Courses</h1><div class=card><b>Total estimé : ${t.toFixed(2)} €</b>${b?` <span class=mu>sur ${b} € de budget</span>`:''}${b&&t>b?' <span class="tag ko">dépassé</span>':''}</div>
<div class=row><button class=b onclick=genShop()>🔄 Depuis le menu</button><button class="b g" onclick="if(confirm('Supprimer les articles cochés ?'))S.shop.filter(x=>x.c).forEach(x=>del('shop',x.id))">Vider les cochés</button></div>
<div class=row><input id=sa class=sp placeholder="Ajouter un article…" onkeydown="if(event.key=='Enter')sadd()"><select id=sr style="width:auto"><option value="">Rayon auto</option>${RAYS.map(r=>`<option>${r}</option>`).join('')}</select><button class=b onclick=sadd()>+</button></div>
${RAYS.map(ry=>{const L=[...S.shop].filter(x=>(x.r||ray(x.name))==ry).sort((a,b)=>(a.c|0)-(b.c|0));return L.length?`<h3>${ry}</h3>`+L.map(x=>`<div class="card row"><input type=checkbox ${x.c?'checked':''} onchange="up('shop','${x.id}','c',this.checked)"><span class="sp ${x.c?'done':''}">${E(x.name)} <span class=mu>${x.q?fmt(x.q,x.u):''}</span></span><input type=number step=any style="width:76px" placeholder="€" value="${x.p||''}" onchange="up('shop','${x.id}','p',+this.value)"><button class="b g" title="Ranger en stock" onclick="s2s('${x.id}')">📦</button><button class="b g" onclick="del('shop','${x.id}')">✕</button></div>`).join(''):''}).join('')}${S.shop.length?'':'<p class=mu>Liste vide. Génère-la depuis le menu ou ajoute des articles.</p>'}`}
function sadd(){const v=$('#sa').value.trim();if(v)save('shop',{name:v,c:0,r:$('#sr').value})}
function s2s(id){const x=S.shop.find(y=>y.id==id);sf('',{name:x.name,q:x.q||1,u:x.u||'u',loc:'Frigo',p:x.p,shop:id})}
function vStat(){const d=S.plan.filter(p=>p.done&&R(p.rid)),c={};d.forEach(p=>c[p.rid]=(c[p.rid]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),sp=S.set.sp||{};
return `<h1>Statistiques</h1><div class=card><b>${d.length}</b> repas cuisinés · <b>${S.recipes.length}</b> recettes · <b>${S.set.saved||0}</b> produit(s) sauvé(s) du gaspillage</div><div class=card><h3>Plats les plus faits</h3>${top.map(([id,n])=>`<div class=row><span class=sp>${E(R(id).t)}</span><b>${n}×</b></div>`).join('')||'<p class=mu>Marquez un plat comme cuisiné pour voir le classement.</p>'}</div><div class=card><h3>Dépenses de courses</h3>${Object.entries(sp).sort().reverse().slice(0,6).map(([k,v])=>`<div class=row><span class=sp>${k}</span><b>${(+v).toFixed(2)} €</b></div>`).join('')||'<p class=mu>Renseignez les prix dans la liste, puis rangez les articles en stock (📦).</p>'}</div>`}
function vSet(){const t=localStorage.th||'auto';return `<h1>Réglages</h1><div class=card><label>Personnes par défaut</label><input type=number min=1 value=${S.set.n||2} onchange="sset('n',+this.value)"><label>Ingrédients à éviter (séparés par des virgules)</label><input value="${E((S.set.ex||[]).join(', '))}" placeholder="tomate, oignon" onchange="sset('ex',this.value.split(',').map(s=>s.trim()).filter(Boolean))"><label>Alerte péremption (jours avant)</label><input type=number min=0 value=${S.set.al??3} onchange="sset('al',+this.value)"><label>Budget courses (€)</label><input type=number value="${S.set.bud||''}" onchange="sset('bud',+this.value)"><label>Thème</label><select onchange="localStorage.th=this.value;ap()">${[['auto','Automatique'],['light','Clair'],['dark','Sombre']].map(([k,l])=>`<option value=${k} ${t==k?'selected':''}>${l}</option>`).join('')}</select></div>
<div class=card><b>🔄 Synchronisation</b><p class=mu>${cn&&cn.open?'🟢 Connecté à l’autre appareil':pp?'⚪ En attente de l’autre appareil (ouvrez Miam-miam dessus)':'Pas encore associé'}</p><p>Mon code : <code>${my}</code> <button class="b g" onclick="navigator.clipboard.writeText(my).then(()=>toast('Code copié'))">Copier</button></p><input id=pc placeholder="Code de l’autre appareil"><div class=row><button class=b onclick=pair()>Associer</button></div><p class=mu>À faire une seule fois : l’association est ensuite automatique.</p></div><div class=card><b>Données</b><p class=mu>Vos données sont stockées sur vos appareils. Envoyez-vous la sauvegarde de temps en temps ; l’import fusionne les deux versions.</p><div class=row><button class="b g" onclick=exp()>📤 Exporter / envoyer</button><label class="b g">📥 Importer<input type=file accept=.json hidden onchange=imb(this)></label><button class="b g" onclick=nreq()>🔔 Activer les alertes</button></div></div>`}
function exp(){const f=new File([JSON.stringify(D)],'miam-miam.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]}).catch(()=>{});const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
// ---- affichage
const TB=[['menu','📅','Menu'],['rec','📖','Recettes'],['stock','📦','Stock'],['shop','🛒','Courses'],['stat','📊','Stats'],['set','⚙️','Réglages']];
function render(f){dot();$('#nav').innerHTML='<div class=lg>🍲 Miam-miam</div>'+TB.map(([k,i,l])=>`<a class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()"><b>${i}</b>${l}</a>`).join('');$('#app').innerHTML=({menu:vMenu,rec:vRec,stock:vStock,shop:vShop,stat:vStat,set:vSet})[S.tab]();if(f){const i=$('#app input');i.focus();i.setSelectionRange(1e3,1e3)}}
async function boot(){const d=await idb('get','d');if(d)D={...D,...d};view();navigator.storage?.persist?.();render();if(typeof Peer!='undefined'){net();setInterval(()=>pe&&(pe.destroyed?net():conn()),15e3)}}
boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
